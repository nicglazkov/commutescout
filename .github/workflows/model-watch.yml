name: Model watch

on:
  schedule:
    - cron: "17 15 * * 1" # Mondays
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install anthropic -c constraints.txt
      - name: Check model catalog
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CA_ROADS_DEMO_PROD }}
        run: |
          set +e
          python scripts/check_models.py | tee changes.txt
          # $? here would be tee's exit code (always 0); the script's is in PIPESTATUS.
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open or update the review issue, and offer the new snapshot
        if: steps.check.outputs.status == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        # main is protected and only takes pull requests, so pushing the
        # snapshot straight to it failed the whole job the first time it
        # ever found something (2026-09-21). The snapshot goes to its own
        # branch instead, rebuilt each run, and the issue points at it.
        # Until someone merges it the same models keep showing as new, so
        # an issue already open for them gets a comment, not a twin.
        run: |
          title="New Claude model(s) available - review demo/eval model choice"
          branch="chore/known-models"
          body="$(printf 'The Models API lists models not in scripts/known_models.json:\n\n```\n%s\n```\n\nReview whether the demo (DEMO_MODEL) or eval models should change. Check pricing and run the evals against the candidate before switching. The updated snapshot is on the `%s` branch.\n' "$(cat changes.txt)" "$branch")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add scripts/known_models.json
          git commit -m "chore: update known-models snapshot"
          git push -f origin "$branch"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
