# The MCP Registry listing is the one place nobody looks at, so it drifts
# in silence: it sat at v2.24.0 for two months, describing the service as
# California-only, because server.json's description was over the
# registry's 100-character limit and every publish failed validation.
#
# This republishes on every release. Authentication is GitHub Actions
# OIDC, so there is no token to rotate and no interactive login: the
# registry accepts the io.github.nicglazkov/* namespace from this repo's
# own workflow. Run it by hand from the Actions tab to repair a listing
# without cutting a release.
name: MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install the publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          chmod +x mcp-publisher
      - name: Validate the manifest
        run: ./mcp-publisher validate
      - name: Sign in
        id: login
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
      # Registry search lists every active version, so a v2.24.0 entry that
      # still called this "Live California" kept turning up beside the
      # current one. Every version older than server.json's is marked
      # deprecated. It also runs when Publish fails, which is what a manual
      # run for a version already published does, so this step alone can
      # be used to tidy the listing.
      - name: Deprecate the older versions
        if: always() && steps.login.outcome == 'success'
        run: |
          name=$(jq -r .name server.json)
          current=$(jq -r .version server.json)
          encoded=$(jq -rn --arg n "$name" '$n|@uri')
          filter='.servers[]
            | select(.server.version != $cur)
            | select((._meta["io.modelcontextprotocol.registry/official"].status // "active") == "active")
            | .server.version'
          curl -sf "https://registry.modelcontextprotocol.io/v0/servers/$encoded/versions" \
            | jq -r --arg cur "$current" "$filter" \
            | while read -r v; do
                ./mcp-publisher status --status deprecated \
                  --message "Superseded by $current" "$name" "$v" \
                  || echo "could not deprecate $v"
              done
