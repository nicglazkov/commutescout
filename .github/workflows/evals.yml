name: Evals

# The suite is 91 questions answered by the production model plus a
# Sonnet 4.6 judge per answer. MANUAL DISPATCH ONLY: the release
# trigger (even diff-gated) burned through the workspace's entire
# monthly API budget twice - a week of rapid releases that touch feed
# code fires a full multi-turn run every time, and each run costs far
# more than the demo assistant serves in a month. Run it by hand from
# the Actions tab when a prompt or tool change actually warrants
# re-scoring.
on:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,evals]" -c constraints.txt
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CA_ROADS_DEMO_PROD }}
          PYTHONPATH: .
          EVAL_SOURCE_REF: ${{ github.sha }}
        run: python evals/run_evals.py --report EVALS.md
      - name: Upload raw results
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: evals/results/
      - name: Commit scorecard to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Carry the generated files
          # onto main so the scorecard lands where readers look.
          mkdir -p /tmp/evalout
          cp EVALS.md evals/results/badge.json evals/results/badge.svg /tmp/evalout/
          cp evals/results/history.jsonl /tmp/evalout/ 2>/dev/null || true
          git stash --include-untracked || true
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          cp /tmp/evalout/EVALS.md EVALS.md
          cp /tmp/evalout/badge.json evals/results/badge.json
          cp /tmp/evalout/badge.svg evals/results/badge.svg
          [ -f /tmp/evalout/history.jsonl ] && cp /tmp/evalout/history.jsonl evals/results/history.jsonl
          git add EVALS.md evals/results/badge.json evals/results/badge.svg evals/results/history.jsonl
          git diff --cached --quiet || git commit -m "docs: update eval scorecard"
          # main may have moved during the (long) eval run; rebase and retry.
          git push origin main || (git pull --rebase origin main && git push origin main)
